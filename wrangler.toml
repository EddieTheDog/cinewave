name = "cinewave"
compatibility_date = "2024-09-23"
pages_build_output_dir = "."

# ─── D1 Database ───────────────────────────────────────
[[d1_databases]]
binding = "DB"
database_name = "cinewave-db"
database_id = "9d8f86f1-1a4b-4a01-87c2-0c049190a9d5"

# ─── R2 Bucket (video storage) ─────────────────────────
# Uncomment after running: npx wrangler r2 bucket create cinewave-videos
# [[r2_buckets]]
# binding = "VIDEOS"
# bucket_name = "cinewave-videos"

# ─── Environment Variables ─────────────────────────────
[vars]
ENVIRONMENT = "production"

# ─── Secrets (set via: npx wrangler secret put ADMIN_SECRET) ───
# ADMIN_SECRET = "your-secure-admin-password"

# ─── Local development ─────────────────────────────────
[dev]
port = 8788
local_protocol = "http"

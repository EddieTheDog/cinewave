name = "cinewave"
compatibility_date = "2024-09-23"
pages_build_output_dir = "."

# ─── D1 Database ───────────────────────────────────────
# Run: npx wrangler d1 create cinewave-db
# Then paste the database_id below
[[d1_databases]]
binding = "DB"
database_name = "cinewave-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# ─── R2 Bucket (video storage) ─────────────────────────
# Run: npx wrangler r2 bucket create cinewave-videos
[[r2_buckets]]
binding = "VIDEOS"
bucket_name = "cinewave-videos"

# ─── Environment Variables ─────────────────────────────
[vars]
ENVIRONMENT = "production"
R2_PUBLIC_ID = "REPLACE_WITH_YOUR_R2_PUBLIC_BUCKET_ID"

# ─── Secrets (set via: npx wrangler secret put ADMIN_SECRET) ───
# ADMIN_SECRET = "your-secure-admin-password"

# ─── Local development ─────────────────────────────────
[dev]
port = 8788
local_protocol = "http"
